name: CI/CD Pipeline with SonarQube + OWASP Dependency-Check

on:
  # push:
  #   branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: self-hosted

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'

    - name: Install Dependencies
      run: npm install
        # ✅ Ensure runner owns the reports (prevents EACCES cleanup errors)
    - name: Fix report directory permissions
      run: sudo chown -R $USER:$USER odc-reports || true

    # ✅ Run OWASP Dependency-Check
    - name: Run OWASP Dependency-Check
      uses: dependency-check/Dependency-Check_Action@main
      with:
        project: "myportfolio"
        path: "."
        format: "ALL"
        out: "odc-reports"

    # ✅ Upload reports as artifacts (downloadable from Actions UI)
    - name: Upload Dependency-Check Reports
      uses: actions/upload-artifact@v4
      with:
        name: dependency-check-reports
        path: odc-reports/

    # ✅ Ensure runner owns the reports (prevents EACCES cleanup errors)
    - name: Fix report directory permissions
      run: sudo chown -R $USER:$USER odc-reports || true

    # ✅ SonarQube Scan with Dependency-Check integration
    - name: SonarQube Scan
      uses: SonarSource/sonarqube-scan-action@v5.0.0
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        SONAR_HOST_URL: https://studioai.logesh.store/
      with:
        projectBaseDir: .
        args: >
          -Dsonar.branch.automaticDetection=false
          -Dsonar.projectKey=myportfolio
          -Dsonar.sources=.
          -Dsonar.dependencyCheck.jsonReportPath=odc-reports/dependency-check-report.json
          -Dsonar.dependencyCheck.htmlReportPath=odc-reports/dependency-check-report.html
  

    # ✅ Optional: Cleanup reports at the end
    - name: Cleanup reports
      if: always()
      run: sudo rm -rf odc-reports || true

